services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: transponder
      POSTGRES_PASSWORD: transponder
      POSTGRES_DB: transponder
    ports:
      - "5432:5432"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transponder -d transponder"]
      interval: 5s
      timeout: 3s
      retries: 20

  transponder:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://transponder:transponder@timescaledb:5432/transponder
    volumes:
      - ./feeds.yaml:/app/feeds.yaml:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tsdb-data:
