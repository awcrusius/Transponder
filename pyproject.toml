[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transponder"
version = "0.1.0"
description = "Config-driven, multi-agency GTFS ingestion pipeline writing to TimescaleDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "gtfs-realtime-bindings>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
transponder = "transponder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["transponder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
